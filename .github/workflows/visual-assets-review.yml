name: Digital Ambush visual asset review
on:
  push:
    branches:
      - review/visual-asset-remediation-20261119
    paths:
      - image-review/asset-plan.json
      - .github/workflows/visual-assets-review.yml
permissions:
  contents: write
jobs:
  apply-reviewed-asset-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - name: Apply local image replacements and provenance
        run: |
          if [ -f image-review/asset-plan.json ]; then
            python image-review/apply_assets.py
          else
            echo 'No asset plan yet'
          fi
      - name: Commit image files to review branch only
        run: |
          git config user.name "Digital Ambush image review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "assets(review): replace trade-incorrect illustrations with generated local imagery"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
