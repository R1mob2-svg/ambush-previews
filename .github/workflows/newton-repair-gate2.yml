name: Newton repair two measured Gate2 hero failures
on:
  push:
    branches:
      - review/visual-asset-remediation-20261119
    paths:
      - .github/workflows/newton-repair-gate2.yml
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check Pillow==11.1.0
          python image-review/fix_two_hero_contrast.py
      - name: Browser, photo tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prove both repaired sites pass real Gate2
        run: |
          node scripts/gate2.js a-snows-roofing-services-12131057/index.html
          node scripts/gate2.js rm-frogley-fencing-and-landscaping-limited-35187792471036/index.html
      - name: Prove all website image references and hashes
        run: python image-review/check_asset_integrity.py
      - name: Commit only tested, SHA-tracked images on review branch
        run: |
          git config user.name "Digital Ambush Newton QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "fix(review): repair two measured Gate2 hero composition failures"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
