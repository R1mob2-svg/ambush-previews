name: Stage third-pass trade imagery
on:
  push:
    branches: [review/visual-asset-remediation-20261119]
    paths: [.github/workflows/stage-commons3.yml]
permissions: {contents: write}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - run: python image-review/stage_commons_3.py
      - run: |
          git config user.name "Digital Ambush photo QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-review/commons-staged-3/
          if ! git diff --cached --quiet; then
            git commit -m "qa(review): stage third-pass relevant service photographs"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
