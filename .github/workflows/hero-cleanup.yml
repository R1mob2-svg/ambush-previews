name: Digital Ambush clean accidental hero lettering
on:
  push:
    branches:
      - review/visual-asset-remediation-20261119
    paths:
      - .github/workflows/hero-cleanup.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - run: python image-review/clean_hero_text.py
      - name: Commit cleaned image files and updated provenance to review branch
        run: |
          git config user.name "Digital Ambush image QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "assets(review): conceal accidental generated hero lettering"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
