name: Newton 88-site real browser Gate2 certification
on:
  push:
    branches:
      - review/visual-asset-remediation-20261119
    paths:
      - .github/workflows/newton-all-gate2.yml
permissions:
  contents: write
jobs:
  verify-all-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducible real browser and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run all 88 source+visual geometry Gate2 checks, retain failures
        run: node scripts/newton_gate_all.js
      - name: Save full immutable Gate2 receipt to review branch
        if: always()
        run: |
          git config user.name "Digital Ambush Newton QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-review/gate2-full-receipt.json
          git add image-review/gate2-receipts/*.json
          if ! git diff --cached --quiet; then
            git commit -m "qa(newton): record real per-site desktop/mobile Gate2 receipts"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newton-88-site-gate2-logs
          path: |
            image-review/gate2-receipts/
            image-review/gate2-full-receipt.json
          retention-days: 30
