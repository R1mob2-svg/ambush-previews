name: Digital Ambush full image integrity certification
on:
  push:
    branches:
      - review/visual-asset-remediation-20261119
    paths:
      - image-review/check_asset_integrity.py
      - .github/workflows/asset-integrity.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - name: Check all hero, supporting assets, hashes and image references
        run: python image-review/check_asset_integrity.py
      - name: Store image-integrity receipt on review branch
        if: always()
        run: |
          git config user.name "Digital Ambush image QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f image-review/integrity-report.json ]; then
            git add image-review/integrity-report.json
            if ! git diff --cached --quiet; then
              git commit -m "qa(review): publish per-site asset-integrity receipt"
              git push origin HEAD:review/visual-asset-remediation-20261119
            fi
          fi
