name: Install accepted third-pass trade photos
on:
  push:
    branches: [review/visual-asset-remediation-20261119]
    paths: [image-review/commons-acceptance-3.json]
permissions: {contents: write}
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - run: python image-review/install_commons_3.py
      - run: python image-review/check_asset_integrity.py
      - run: |
          git config user.name "Digital Ambush photo QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add "*/image-credits.html"
          if ! git diff --cached --quiet; then
            git commit -m "assets(review): add eight reviewed, licensed trade photos"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
