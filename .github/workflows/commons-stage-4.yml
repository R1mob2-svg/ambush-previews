name: Digital Ambush licensed photo staging round 4
on:
  push:
    branches:
      - review/visual-asset-remediation-20261119
    paths:
      - image-review/stage_commons_4.py
      - image-review/commons-replacements-round4.json
      - .github/workflows/commons-stage-4.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - name: Stage commercially licensed Commons photos
        run: python image-review/stage_commons_4.py
      - name: Commit visual inspection sheet only, no site changes
        run: |
          git config user.name "Digital Ambush image QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-review/commons-staged-4/
          if ! git diff --cached --quiet; then
            git commit -m "qa(review): stage fourth pass licensed candidate sheet"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
