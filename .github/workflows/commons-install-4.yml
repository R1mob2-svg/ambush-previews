name: Install accepted no-cost photos round 4
on:
  push:
    branches:
      - review/visual-asset-remediation-20261119
    paths:
      - .github/workflows/commons-install-4.yml
      - image-review/install_commons_4.py
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - name: Install explicitly accepted assets
        run: python image-review/install_commons_4.py
      - name: Verify integrity before commit
        run: python image-review/check_asset_integrity.py
      - name: Commit verified review-only file replacements
        run: |
          git config user.name "Digital Ambush image QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- a-b-plastering-and-rendering-12131009/ uk-calligraphy-and-painting-art-academy-35187792471025/
          if ! git diff --cached --quiet; then
            git commit -m "assets(review): install two approved zero-cost trade-support images"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
