name: Stage reviewed Wikimedia photography
on:
  push:
    branches: [review/visual-asset-remediation-20261119]
    paths: [.github/workflows/stage-commons.yml]
permissions: {contents: write}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - run: python image-review/stage_commons.py
      - name: Commit staged photo options and provenance only
        run: |
          git config user.name "Digital Ambush photo QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-review/commons-staged
          if ! git diff --cached --quiet; then
            git commit -m "qa(review): stage licence-checked trade-photo choices for visual acceptance"
            git push origin HEAD:review/visual-asset-remediation-20261119
          fi
